# 前端 Nginx 配置文件
# 适用于 Ubuntu/Debian: /etc/nginx/sites-available/logindemo-frontend
# 适用于 CentOS/RHEL: /etc/nginx/conf.d/logindemo-frontend.conf

# HTTP 服务器配置
server {
    listen 80;
    server_name 120.77.92.36;  # 替换为你的域名或IP，例如：your-domain.com

    # 前端静态文件目录
    root /opt/logindemo/frontend;
    index index.html;

    # 日志配置
    access_log /var/log/nginx/logindemo-frontend_access.log;
    error_log /var/log/nginx/logindemo-frontend_error.log;

    # 客户端最大请求体大小
    client_max_body_size 10M;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript 
               image/svg+xml;

    # 静态资源缓存（长期缓存）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API 请求代理到后端 Spring Boot 应用
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering off;
        proxy_request_buffering off;

        # CORS 支持（如果后端没有配置 CORS）
        # add_header Access-Control-Allow-Origin * always;
        # add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        # add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        # if ($request_method = 'OPTIONS') {
        #     return 204;
        # }
    }

    # React Router 支持 - 所有路由都返回 index.html
    # 这是单页应用（SPA）的关键配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 健康检查端点（可选）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
