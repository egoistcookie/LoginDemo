<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端服务测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>后端服务测试工具</h1>
    <p>服务器地址: <strong>http://120.77.92.36:8080/api</strong></p>

    <div class="test-section">
        <h3>1. 测试健康检查接口</h3>
        <button onclick="testValidate()">测试 /api/auth/validate</button>
        <div id="validate-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. 测试登录接口</h3>
        <button onclick="testLogin()">测试登录 (1111/111111)</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. 测试笔记接口</h3>
        <p>Token: <input type="text" id="token" style="width: 500px;" placeholder="先登录获取 token"></p>
        <button onclick="testNotes()">测试 /api/notes</button>
        <div id="notes-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>4. 测试所有接口路径</h3>
        <button onclick="testAllPaths()">测试所有可能的路径</button>
        <div id="all-paths-result" class="result"></div>
    </div>

    <script>
        const baseURL = 'http://120.77.92.36:8080';

        async function testValidate() {
            const resultDiv = document.getElementById('validate-result');
            resultDiv.textContent = '测试中...';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`${baseURL}/api/auth/validate`, {
                    method: 'GET'
                });
                
                const data = await response.json();
                resultDiv.textContent = `状态码: ${response.status}\n响应: ${JSON.stringify(data, null, 2)}`;
                resultDiv.className = response.ok ? 'result success' : 'result error';
            } catch (error) {
                resultDiv.textContent = `错误: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.textContent = '测试中...';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`${baseURL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: '1111',
                        password: '111111'
                    })
                });
                
                const data = await response.json();
                resultDiv.textContent = `状态码: ${response.status}\n响应: ${JSON.stringify(data, null, 2)}`;
                resultDiv.className = response.ok ? 'result success' : 'result error';

                // 如果登录成功，自动填充 token
                if (data.code === 200 && data.data && data.data.accessToken) {
                    document.getElementById('token').value = data.data.accessToken;
                }
            } catch (error) {
                resultDiv.textContent = `错误: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        async function testNotes() {
            const resultDiv = document.getElementById('notes-result');
            const token = document.getElementById('token').value;

            if (!token) {
                resultDiv.textContent = '请先登录获取 token';
                resultDiv.className = 'result error';
                return;
            }

            resultDiv.textContent = '测试中...';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`${baseURL}/api/notes`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                resultDiv.textContent = `状态码: ${response.status}\n响应: ${JSON.stringify(data, null, 2)}`;
                resultDiv.className = response.ok ? 'result success' : 'result error';
            } catch (error) {
                resultDiv.textContent = `错误: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        async function testAllPaths() {
            const resultDiv = document.getElementById('all-paths-result');
            resultDiv.textContent = '测试中...\n';
            resultDiv.className = 'result';

            const paths = [
                '/api/notes',
                '/notes',
                '/api/api/notes',
                '/auth/validate',
                '/api/auth/validate'
            ];

            let results = '';

            for (const path of paths) {
                try {
                    const response = await fetch(`${baseURL}${path}`, {
                        method: 'GET'
                    });
                    results += `${path}: ${response.status} ${response.statusText}\n`;
                } catch (error) {
                    results += `${path}: 错误 - ${error.message}\n`;
                }
            }

            resultDiv.textContent = results;
        }
    </script>
</body>
</html>
